baseURL = "https://www.chilblane.com/"
languageCode = "en-us"
title = "Daniel Singer | Design systems designer"
timeout = 60000

# No taxonomies: case studies use knowledge/skills params, so Hugo's default
# /tags/ and /categories/ pages were empty (and listed in the sitemap).
disableKinds = ["taxonomy", "term"]


[params]
    description = "Daniel Singer is a design systems designer and design technologist based in Tempe, Arizona."
    navTitle = "Daniel Singer"
    navSubTitle = "chilblane"
    email = "daniel at chilblane dot com"
    github = "https://www.github.com/chilblane"
    linkedin = "https://www.linkedin.com/in/chilblane"

    images = ["og-image.jpg"]

[menu]
    [[menu.main]]
        name = "Home"
        url = "/"
        weight = 1
    [[menu.main]]
        name = "Portfolio"
        url = "/work/"
        weight = 2
    [[menu.main]]
        name = "Resume"
        url = "/resume/"
        weight = 3

[services]
  [services.googleAnalytics]
    ID = 'G-LH45RPKL08'

[markup]
  [markup.highlight]
    style = 'github-dark'
    wrapperClass = 'c-highlight'



